# Banco local pra desenvolvimento.
#
#   docker compose up -d
#
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bruno_financas
      POSTGRES_PASSWORD: bruno_financas
      POSTGRES_DB: bruno_financas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bruno_financas']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis ainda não é usado. Descomente quando precisar.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
